spring:
  application:
    name: blog
    
  config:
    # Em desenvolvimento local, lê as variáveis do .env (não versionado), se existir.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  shutdown: graceful
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
conduit:
  jwt:
    secret: ${JWT_SECRET}
    issuer: conduit
    time-to-live: 24h
