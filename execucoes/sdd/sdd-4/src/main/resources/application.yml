spring:
  application:
    name: blog
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
conduit:
  jwt:
    segredo: ${JWT_SECRET}
    validade: PT24H
    emissor: conduit
