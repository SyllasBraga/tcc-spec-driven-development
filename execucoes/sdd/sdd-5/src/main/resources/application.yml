spring:
  application:
    name: blog
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
conduit:
  token:
    segredo: ${JWT_SECRET}
    validade: 24h
    emissor: conduit
